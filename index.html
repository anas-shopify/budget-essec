<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Étudiant ESSEC</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .bg-green-500:hover { background-color: #68d391; }
        .bg-orange-500:hover { background-color: #fb9224; }
        .bg-red-500:hover { background-color: #f87272; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-800 font-sans">

<div class="container mx-auto p-4">
    <h1 class="text-2xl font-bold mb-4">Budget Étudiant ESSEC</h1>

    <div class="grid grid-cols-3 gap-4 mb-4">
        <div class="bg-green-500 text-white p-4 rounded-lg">
            <p class="text-2xl font-bold">Budget Total</p>
            <p class="text-4xl">1500 DH</p>
        </div>
        <div class="bg-green-500 text-white p-4 rounded-lg">
            <p class="text-2xl font-bold">Total Dépensé</p>
            <p id="totalSpent" class="text-4xl">0 DH</p>
        </div>
        <div class="bg-green-500 text-white p-4 rounded-lg">
            <p class="text-2xl font-bold">Solde Restant</p>
            <p id="remainingBalance" class="text-4xl">1500 DH</p>
        </div>
    </div>

    <div class="bg-white dark:bg-gray-700 p-4 rounded-lg shadow-lg mb-4">
        <h2 class="text-xl font-bold mb-2">Jauge de Progression</h2>
        <div class="relative">
            <div class="bg-gray-300 dark:bg-gray-600 rounded-full h-2 overflow-hidden">
                <div id="progressBar" class="bg-green-500 h-2 rounded-full" style="width: 0%;"></div>
            </div>
        </div>
    </div>

    <form class="mb-4">
        <input id="amount" type="number" min="1" class="border border-gray-300 dark:border-gray-600 p-2 rounded-lg w-full mb-2" placeholder="Montant (DH)">
        <select id="category" class="border border-gray-300 dark:border-gray-600 p-2 rounded-lg w-full mb-2">
            <option value="Courses">Courses</option>
            <option value="Repas Campus">Repas Campus</option>
            <option value="Snack">Snack</option>
            <option value="Divers">Divers</option>
        </select>
        <input id="description" type="text" class="border border-gray-300 dark:border-gray-600 p-2 rounded-lg w-full mb-2" placeholder="Description">
        <button type="button" onclick="addTransaction()" class="bg-green-500 text-white p-2 rounded-lg w-full hover:bg-green-600">Ajouter</button>
    </form>

    <div id="transactions" class="bg-white dark:bg-gray-700 p-4 rounded-lg shadow-lg">
        <h2 class="text-xl font-bold mb-2">Historique des Transactions</h2>
        <ul id="transactionList"></ul>
    </div>
</div>

<script>
    let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
    let totalSpent = 0;

    function updateUI() {
        const remainingBalanceElement = document.getElementById('remainingBalance');
        const progressBarElement = document.getElementById('progressBar');
        const totalSpentElement = document.getElementById('totalSpent');
        const transactionListElement = document.getElementById('transactionList');

        totalSpent = transactions.reduce((acc, t) => acc + t.amount, 0);
        remainingBalanceElement.textContent = (1500 - totalSpent) + ' DH';
        progressBarElement.style.width = (totalSpent / 1500 * 100) + '%';
        progressBarElement.classList.remove('bg-green-500', 'bg-orange-500', 'bg-red-500');
        if ((totalSpent / 1500) < 0.33) progressBarElement.classList.add('bg-green-500');
        else if ((totalSpent / 1500) < 0.66) progressBarElement.classList.add('bg-orange-500');
        else progressBarElement.classList.add('bg-red-500');
        totalSpentElement.textContent = totalSpent + ' DH';

        transactionListElement.innerHTML = '';
        transactions.forEach(t => {
            const li = document.createElement('li');
            li.textContent = `${t.amount} DH - ${t.category} - ${t.description}`;
            li.classList.add('flex', 'justify-between', 'items-center', 'p-2', 'border-b', 'border-gray-300', 'dark:border-gray-600');
            li.addEventListener('click', () => {
                li.remove();
                transactions = transactions.filter(tx => tx !== t);
                localStorage.setItem('transactions', JSON.stringify(transactions));
                updateUI();
            });
            transactionListElement.appendChild(li);
        });
    }

    function addTransaction() {
        const amount = parseInt(document.getElementById('amount').value);
        const category = document.getElementById('category').value;
        const description = document.getElementById('description').value;
        if (amount > 0) {
            transactions.push({ amount, category, description });
            localStorage.setItem('transactions', JSON.stringify(transactions));
            updateUI();
        }
    }

    document.getElementById('amount').addEventListener('input', () => {
        const amount = parseInt(document.getElementById('amount').value);
        document.getElementById('amount').value = isNaN(amount) ? '' : amount;
    });

    document.getElementById('amount').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addTransaction();
    });

    updateUI();
</script>

</body>
</html>
